# =============================================================================
#  Spark Teacher Workspace — Local Development Infrastructure
#  Services: PostgreSQL 16 · Redis 7 · MinIO (S3-compatible object storage)
#
#  ⚠️  Important — Data Safety
#    - NEVER run `docker compose down -v` — it will destroy the database volume.
#    - Use `pnpm db:stop` (compose stop) to halt without removing volumes.
#    - Use `pnpm db:up`   to start or re-create missing containers.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: spark-teacher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spark_teacher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-spark_teacher_workspace}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spark_teacher} -d ${POSTGRES_DB:-spark_teacher_workspace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spark-teacher-redis
    restart: unless-stopped
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru"
    ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: spark-teacher-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: spark-teacher-postgres-data
  redis_data:
    name: spark-teacher-redis-data
  minio_data:
    name: spark-teacher-minio-data
