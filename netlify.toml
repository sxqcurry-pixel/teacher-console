# Netlify 部署配置 — 放在仓库根目录，不设 base。
# Netlify 在仓库根目录安装 pnpm workspace 依赖，再用命令显式构建 shared 包和 web。
# publish 显式指向 apps/web/.next（相对仓库根，单一路径，不会出现 apps/web/apps/web 重复）。
# 浏览器走同源 /api/v1，由 Next rewrite（build 时读 BACKEND_URL）服务端代理到 Railway，无 CORS。

[build]
  command = "pnpm --filter @spark/shared run build && pnpm --filter web run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  NEXT_TELEMETRY_DISABLED = "1"
