# Netlify 部署配置 — 仓库根目录，不设 base。
# /api/v1/* 由 Next.js catch-all route handler（src/app/api/v1/[...path]/route.ts）
# 在服务端显式代理到 Railway（读 BACKEND_URL），原样转发方法/请求体/认证头，无 CORS。

[build]
  command = "pnpm --filter @spark/shared run build && pnpm --filter web run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  NEXT_TELEMETRY_DISABLED = "1"
